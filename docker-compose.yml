version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: tasktracker
      POSTGRES_PASSWORD: tasktracker_secret
      POSTGRES_DB: tasktracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://tasktracker:tasktracker_secret@db:5432/tasktracker
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      AUTH_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
